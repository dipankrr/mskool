<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fee Page Mockups</title>
<style>
/* ============================================================
   Student fee page revamp (2026-11-02). Mockup only.
   Every value below is a token from apps/mobile/src/theme:
   type {11,12,13,14,15,16,20,30,34}, 4-pt spacing, radii
   12/14/16/24/full, one emerald accent, tones as status only.
   Phones are 360 wide: the compact width MOBILE_PLAN asks for.
   Aditi's figures are the demo school's real ones on 2 Nov 2026;
   every other student is made up to show a state.
   ============================================================ */
@font-face { font-family: Clash; font-weight: 400; src: url(../../../../apps/mobile/assets/fonts/ClashGrotesk-Regular.ttf); }
@font-face { font-family: Clash; font-weight: 500; src: url(../../../../apps/mobile/assets/fonts/ClashGrotesk-Medium.ttf); }
@font-face { font-family: Clash; font-weight: 600; src: url(../../../../apps/mobile/assets/fonts/ClashGrotesk-Semibold.ttf); }
@font-face { font-family: Clash; font-weight: 700; src: url(../../../../apps/mobile/assets/fonts/ClashGrotesk-Bold.ttf); }
:root {
  --canvas: #F2F3F7; --surface: #FFFFFF; --ink: #101828; --muted: #5D6674;
  --hair: rgba(16, 24, 40, 0.08); --accent: #0F7A44; --deep: #0B6B3A; --tint: #E8F5EE;
  --field: #ECEEF3; --chip: #E9EDF3; --chev: #98A2B3;
  --scrim: rgba(16, 24, 40, 0.45); --grab: #D5DAE2;
  --amb: #B54708; --amb-t: #FFFAEB; --red: #B42318; --red-t: #FEF3F2; --slate: #475467; --slate-t: #F2F4F7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: light; }
body { background: #DADBD6; color: var(--ink); font-family: Clash, system-ui, sans-serif; font-size: 15px; padding: 32px 16px 64px; }
svg { display: block; flex: none; }

.intro { max-width: 1160px; margin: 0 auto 32px; }
.intro h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.6px; }
.intro p { margin-top: 4px; color: var(--muted); }
.group { max-width: 1160px; margin: 40px auto 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #3C4450; }
.frames { max-width: 1160px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 32px 24px; }
figure { width: 360px; max-width: 100%; }
figcaption { margin-top: 12px; font-size: 13px; color: #3C4450; line-height: 1.4; }
figcaption b { font-weight: 600; color: var(--ink); }

.phone { position: relative; width: 360px; height: 760px; max-width: 100%; background: var(--canvas); border-radius: 32px; overflow: hidden; box-shadow: 0 0 0 1px rgba(16,24,40,.1), 0 14px 34px rgba(16,24,40,.12); }
.status { height: 32px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; }
.status i { width: 40px; height: 8px; border-radius: 999px; background: var(--ink); opacity: .75; }
.body { padding: 0 20px; }
.meta { font-size: 13px; color: var(--muted); }
.label { font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); }
.name { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
.tnum { font-variant-numeric: tabular-nums; }
.grow { flex: 1; min-width: 0; }
.clip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card { background: var(--surface); border-radius: 16px; }
.pill { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; flex: none; }
.pill.p { color: var(--deep); background: var(--tint); }
.pill.c { color: var(--amb); background: var(--amb-t); }
.pill.r { color: var(--red); background: var(--red-t); }
.pill.n { color: var(--slate); background: var(--slate-t); }

/* header: who, on one line, and it stays pinned while the page scrolls */
.who { height: 56px; padding: 0 20px 0 4px; display: flex; align-items: center; gap: 8px; }
.back { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex: none; }
.avatar { width: 40px; height: 40px; border-radius: 999px; background: var(--chip); color: var(--slate); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex: none; margin-left: -4px; }
.whoname { font-size: 20px; font-weight: 700; letter-spacing: -0.2px; line-height: 1.2; }
.round { width: 38px; height: 38px; border-radius: 999px; background: var(--tint); color: var(--deep); display: flex; align-items: center; justify-content: center; flex: none; }
.screenhead { height: 56px; padding: 0 20px 0 4px; display: flex; align-items: center; gap: 4px; }

/* hero: only what adds up to the big number */
.hero { margin-top: 8px; padding: 16px 16px 0; }
.herotop { min-height: 26px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.big { margin-top: 4px; font-size: 34px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.15; }
.split { margin-top: 12px; display: flex; gap: 2px; height: 8px; }
.split i { display: block; border-radius: 999px; min-width: 6px; }
.part { min-height: 28px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
.parts { margin-top: 8px; padding-bottom: 8px; }
.part span.when { font-size: 13px; font-weight: 400; color: var(--muted); }
.part b { font-weight: 600; margin-left: auto; }
.dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
.herolink { margin: 0 -16px; padding: 0 16px; min-height: 44px; border-top: 1px solid var(--hair); display: flex; align-items: center; justify-content: space-between; color: var(--deep); font-size: 14px; font-weight: 600; }
.calm { margin-top: 12px; padding-bottom: 16px; display: flex; align-items: center; gap: 8px; }

/* four actions, one row: everyone can see them, nothing fires on one tap */
.quick { margin-top: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.q { height: 72px; border-radius: 14px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink); }
.q span { color: var(--deep); }

/* the session, all twelve months, no sideways scrolling */
.year { margin-top: 12px; padding: 16px; }
.yearhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.progress { margin-top: 8px; height: 6px; border-radius: 999px; background: var(--field); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.grid { margin-top: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.m { position: relative; height: 52px; padding: 0 2px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; overflow: hidden; }
.m u { text-decoration: none; font-size: 12px; font-weight: 600; }
.m em { font-style: normal; font-size: 13px; font-variant-numeric: tabular-nums; display: flex; align-items: center; height: 16px; }
.m.over { background: var(--red-t); color: var(--red); } .m.over em { font-weight: 600; }
.m.now { background: var(--amb-t); color: var(--amb); box-shadow: inset 0 0 0 2px var(--amb); } .m.now em { font-weight: 600; }
.m.later { background: var(--slate-t); color: var(--slate); }
.m.paid { background: var(--tint); color: var(--deep); }
.m.none { background: var(--canvas); color: var(--muted); }
.m s { position: absolute; left: 8px; right: 8px; bottom: 4px; height: 2px; border-radius: 999px; background: rgba(180, 35, 24, 0.18); text-decoration: none; }
.m s i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.legend { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.swatch { width: 12px; height: 12px; border-radius: 4px; flex: none; display: flex; align-items: center; justify-content: center; }

/* lists */
.section { margin: 20px 4px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.row { position: relative; min-height: 62px; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 68px; right: 0; height: 1px; background: var(--hair); }
.row.flush + .row.flush::before { left: 16px; }
.tile { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--chip); color: var(--slate); flex: none; }
.tile.p { background: var(--tint); color: var(--deep); }
.tile.c { background: var(--amb-t); color: var(--amb); }
.amount { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; font-variant-numeric: tabular-nums; flex: none; }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }

/* collect */
.cta { height: 52px; border-radius: 999px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600; box-shadow: 0 10px 24px rgba(16,24,40,.16); }
.cta.soft { background: var(--tint); color: var(--deep); box-shadow: none; }
.float { position: absolute; left: 20px; right: 20px; bottom: 16px; z-index: 2; }
.dock { position: absolute; left: 16px; right: 16px; bottom: 16px; height: 64px; padding: 6px 6px 6px 20px; border-radius: 32px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid rgba(16,24,40,.06); box-shadow: 0 14px 34px rgba(16,24,40,.12); z-index: 2; }
.dock .cta { padding: 0 20px; box-shadow: none; }

/* sheet */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 3; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: 0 -12px 40px rgba(16,24,40,.18); z-index: 4; display: flex; flex-direction: column; }
.grab { width: 36px; height: 4px; border-radius: 999px; background: var(--grab); margin: 8px auto 4px; }
.sheethead { padding: 8px 20px 0; display: flex; justify-content: space-between; gap: 8px; }
.sheethead .t { font-size: 20px; font-weight: 700; letter-spacing: -0.2px; }
.sheethead .x { width: 44px; height: 44px; margin: -4px -12px 0 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.sheetbody { padding: 8px 0 20px; }
.three { margin: 4px 20px 8px; padding: 12px 0; display: flex; border-radius: 14px; background: var(--canvas); }
.three div { flex: 1; text-align: center; }
.three div + div { border-left: 1px solid var(--hair); }
.three b { display: block; font-size: 16px; font-weight: 600; letter-spacing: -0.2px; font-variant-numeric: tabular-nums; }
.three span { font-size: 12px; color: var(--muted); }

/* every due */
.chips { margin-top: 4px; display: flex; gap: 8px; }
.chipf { height: 44px; padding: 0 16px; border-radius: 999px; background: var(--surface); color: var(--muted); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.chipf.on { background: var(--tint); color: var(--deep); }
.chipf small { font-size: 12px; font-weight: 500; }
.monthhead { margin: 16px 4px 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.duerow { position: relative; min-height: 52px; padding: 8px 8px 8px 16px; display: flex; align-items: center; gap: 8px; }
.duerow + .duerow::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--hair); }
.sheetbody .duerow { padding-left: 20px; padding-right: 12px; }
.sheetbody .duerow + .duerow::before { left: 20px; }
.notice { margin-top: 8px; padding: 12px; border-radius: 14px; display: flex; align-items: center; gap: 8px; background: var(--amb-t); color: var(--amb); font-size: 13px; font-weight: 500; line-height: 1.35; }
.notice b { margin-left: auto; font-weight: 600; flex: none; padding-left: 8px; }
.block { margin-top: 12px; padding: 16px; }
.block .cta { margin-top: 12px; height: 44px; font-size: 15px; box-shadow: none; }

/* Fees tab: its real header, search, chips and list rows */
.feestop { min-height: 48px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.act { min-height: 38px; display: inline-flex; align-items: center; gap: 4px; padding: 0 12px; border-radius: 999px; background: var(--tint); color: var(--deep); font-size: 12px; font-weight: 600; }
.h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.15; }
.fold { height: 32px; margin-top: 4px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.search { height: 48px; padding: 0 12px; border-radius: 12px; background: var(--field); display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 16px; }
.fchips { margin-top: 12px; display: flex; gap: 4px; }
.fp { height: 40px; padding: 0 12px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair); display: flex; align-items: center; gap: 2px; font-size: 13px; color: var(--ink); white-space: nowrap; }
.fp.on { background: var(--tint); color: var(--deep); box-shadow: inset 0 0 0 1px var(--accent); }
.listhead { margin-top: 12px; min-height: 38px; display: flex; align-items: center; gap: 8px; }
.sortl { display: flex; align-items: center; gap: 2px; font-size: 13px; color: var(--deep); white-space: nowrap; flex: none; }
.viewtog { display: flex; gap: 2px; padding: 2px; border-radius: 999px; background: var(--field); flex: none; }
.viewtog div { width: 36px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.viewtog .on { background: var(--surface); color: var(--deep); }
.lrow { padding: 12px 12px 0; }
.lrow + .lrow { margin-top: 8px; }
.lrow > div:first-child { display: flex; justify-content: space-between; gap: 12px; }
.moreinfo { min-height: 40px; display: flex; align-items: center; gap: 2px; color: var(--deep); font-size: 13px; }
.fab { position: absolute; right: 20px; bottom: 16px; height: 52px; padding: 0 16px; border-radius: 999px; background: var(--accent); color: #fff; display: flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 600; box-shadow: 0 10px 24px rgba(16,24,40,.16); z-index: 2; }

/* the year matrix: one row per student, one box per fee month */
.mx { margin-top: 8px; padding: 12px 12px 4px; }
.mxtop { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.mxlegend { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.mxlegend span { display: inline-flex; align-items: center; gap: 4px; }
.mxlegend .box { width: 12px; height: 12px; flex: none; }
.mline { display: flex; align-items: stretch; }
.mline.body-row { min-height: 44px; border-top: 1px solid var(--hair); }
.mcells { flex: 1; min-width: 0; display: grid; }
.c { display: flex; align-items: center; justify-content: center; padding: 0 1px; }
.c.cur { background: rgba(16, 24, 40, 0.05); }
.mhead .c { height: 24px; font-size: 11px; font-weight: 500; color: var(--muted); }
.mhead .c.cur { color: var(--ink); font-weight: 700; border-radius: 4px 4px 0 0; }
.mn { width: 100px; flex: none; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; }
.mline.right .mn { padding-left: 8px; }
.mline.left .mn { padding-right: 8px; }
.mn b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mn span { font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.box { display: flex; align-items: center; justify-content: center; width: 100%; height: 20px; border-radius: 4px; color: #fff; }
.box.r { background: var(--red); }
.box.g { background: var(--accent); }
.box.h { background: linear-gradient(135deg, var(--accent) 50%, var(--red) 50%); }
.box.l { background: var(--chip); }
.box.x { box-shadow: inset 0 0 0 1px rgba(16, 24, 40, 0.14); }

/* Collect payment */
.amt { margin-top: 8px; padding: 16px; }
.amthead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.amtbig { margin-top: 4px; display: flex; align-items: center; gap: 2px; font-size: 34px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.amtbig.typing { color: var(--ink); }
.caret { width: 2px; height: 32px; background: var(--accent); border-radius: 2px; margin-left: 2px; }
.amtline { margin-top: 4px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.amtline b { font-weight: 600; color: var(--ink); }
.amtline u { text-decoration: none; color: var(--deep); font-weight: 600; margin-left: auto; }
.qrow { margin: 12px -16px 0; padding: 0 16px; display: flex; gap: 8px; overflow: hidden; }
.qc { flex: none; height: 40px; padding: 0 12px; border-radius: 999px; background: var(--canvas); display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.qc span { font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.qc.on { background: var(--tint); color: var(--deep); box-shadow: inset 0 0 0 1px var(--accent); }
.qc.on span { color: var(--deep); }
.covers { margin-top: 12px; }
.covhead { padding: 12px 16px 4px; display: flex; justify-content: space-between; align-items: baseline; }
.cov { position: relative; min-height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; }
.cov + .cov::before { content: ""; position: absolute; top: 0; left: 48px; right: 0; height: 1px; background: var(--hair); }
.cov b { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.cov .when { font-size: 13px; color: var(--muted); font-weight: 400; }
.ok { width: 20px; height: 20px; border-radius: 999px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
.halfok { width: 20px; height: 20px; border-radius: 999px; background: conic-gradient(var(--amb) 0 10%, var(--amb-t) 10% 100%); box-shadow: inset 0 0 0 2px var(--amb); flex: none; }
.notyet { width: 20px; height: 20px; border-radius: 999px; box-shadow: inset 0 0 0 2px var(--grab); flex: none; }
.covfoot { border-top: 1px solid var(--hair); min-height: 44px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); }
.covfoot u { text-decoration: none; color: var(--deep); font-weight: 600; display: flex; align-items: center; gap: 4px; }
.modes { margin-top: 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mode { height: 64px; border-radius: 14px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--slate); }
.mode.on { background: var(--tint); color: var(--deep); box-shadow: inset 0 0 0 2px var(--accent); }
.form { margin-top: 12px; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.fld { display: flex; flex-direction: column; gap: 4px; }
.fld > span { font-size: 13px; font-weight: 600; }
.inp { height: 48px; border-radius: 12px; background: var(--field); padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 16px; font-variant-numeric: tabular-nums; }
.inp.ph { color: var(--muted); }
.inp.on { box-shadow: inset 0 0 0 2px var(--accent); background: var(--surface); }
.pairf { display: flex; gap: 8px; } .pairf > * { flex: 1; min-width: 0; }
.factrow { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--hair); }
.form .factrow:last-child { border-bottom: none; }
.factrow b { display: flex; align-items: center; gap: 4px; font-weight: 600; font-size: 15px; }
.addl { min-height: 44px; display: flex; align-items: center; gap: 8px; color: var(--deep); font-size: 15px; font-weight: 600; }
.tot { margin-top: 12px; padding: 8px 16px; }
.tl { min-height: 32px; display: flex; align-items: center; gap: 8px; font-size: 14px; }
.tl b { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.tl.big { min-height: 44px; border-top: 1px solid var(--hair); margin-top: 4px; font-size: 16px; font-weight: 600; }
.tl.big b { font-size: 20px; font-weight: 700; }
.tl u { text-decoration: none; color: var(--deep); font-weight: 600; font-size: 13px; }
.kbd { position: absolute; left: 0; right: 0; bottom: 0; height: 236px; background: #D5D9E0; padding: 8px 6px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; z-index: 3; }
.kbd div { border-radius: 8px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 500; }
.kbd div.k2 { background: #BCC2CC; }
.receipt { margin: 4px 20px 0; padding: 16px; border-radius: 16px; background: var(--canvas); }
.rline { min-height: 30px; display: flex; align-items: center; gap: 8px; font-size: 14px; }
.rline b { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.sheetfoot2 { padding: 12px 20px 20px; display: flex; gap: 8px; }
.sheetfoot2 .cta { flex: 1; box-shadow: none; }
.sheetfoot2 .ghost { height: 52px; padding: 0 20px; border-radius: 999px; background: var(--field); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: var(--ink); }
.done { padding: 40px 20px 0; text-align: center; display: flex; flex-direction: column; align-items: center; }
.donebadge { width: 72px; height: 72px; border-radius: 999px; background: var(--tint); color: var(--deep); display: flex; align-items: center; justify-content: center; }
.donebtns { margin-top: 24px; width: 100%; display: flex; flex-direction: column; gap: 8px; }
.donebtns .cta { box-shadow: none; }
.donebtns .ghost { height: 52px; border-radius: 999px; background: var(--surface); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600; color: var(--ink); }

/* Printing: the PrintSheet the app already has, Share PDF beside Print */
.doccard { margin: 4px 20px 0; padding: 12px; border-radius: 14px; background: var(--canvas); display: flex; align-items: center; gap: 12px; }
.doccard .tile { background: var(--surface); }
.plabel { margin: 16px 20px 4px; font-size: 13px; font-weight: 600; }
.radio { min-height: 44px; padding: 0 20px; display: flex; align-items: center; gap: 12px; font-size: 15px; }
.radio i { width: 20px; height: 20px; border-radius: 999px; box-shadow: inset 0 0 0 2px var(--chev); flex: none; }
.radio.on i { box-shadow: inset 0 0 0 6px var(--accent); }
.radio small { margin-left: auto; font-size: 12px; color: var(--muted); }
.textlink { margin: 4px 20px 0; min-height: 44px; display: flex; align-items: center; gap: 8px; color: var(--deep); font-size: 15px; font-weight: 600; }
.pmodes { margin: 0 20px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.pmodes .mode { height: 56px; flex-direction: row; gap: 8px; background: var(--canvas); }
.pmodes .mode.on { background: var(--tint); }
.seg { margin: 0 20px; display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--field); }
.seg div { flex: 1; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg .on { background: var(--surface); color: var(--deep); }
.dis { opacity: .55; }

/* Pay this */
.paybtn { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--tint); color: var(--deep); display: flex; align-items: center; font-size: 13px; font-weight: 600; }
.duerow.pay { min-height: 60px; padding-right: 16px; gap: 12px; }
.sheetbody .duerow.pay { padding-right: 20px; }
.monthhead .paylink { font-size: 13px; font-weight: 600; color: var(--deep); display: flex; align-items: center; }
.monthhead .lbl { display: flex; align-items: baseline; gap: 6px; }
.monthhead .lbl em { font-style: normal; font-size: 12px; font-weight: 600; color: var(--red); }
.sheetcta { padding: 8px 20px 20px; }
.sheetcta .cta { box-shadow: none; }
.context { margin: 12px -16px -16px; padding: 0 16px; min-height: 44px; border-top: 1px solid var(--hair); display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); }
.context u { text-decoration: none; color: var(--deep); font-weight: 600; }

@media (max-width: 420px) { body { padding: 20px 16px 48px; } .frames { gap: 28px 0; } }
</style>

  ${phone("<b>1b. Opened from a month or a due.</b> Pay on April (or on one fee) lands here with only that selected. The card says where it came from, older dues it leaves open, and one tap goes back to paying everything.", colFromMonth, "", recordCta("Record ₹5,450 · Cash"))}
  ${phone("<b>2. Paying part.</b> Type any amount, or tap a shortcut. &ldquo;This pays&rdquo; shows which dues it settles, oldest first, and what is still left. The Record button comes back when the keyboard closes.", colTyping)}
  ${phone("<b>3. Mode, then only its fields.</b> Six large tiles instead of small pills. UPI asks for one reference. Discount and note stay hidden until asked for.", colUpi)}
  ${phone("<b>4. Cheque.</b> Number, bank and date side by side, and a plain warning that it stays pending.", colCheque)}
  ${phone("<b>5. Discount and late fee.</b> Only for people allowed to give them. Every change shows in the totals and on the button.", colDiscount)}
  ${phone("<b>6. Adjust per fee.</b> The rare case, a parent paying for specific fees. A sheet, so the main screen stays simple.", colAdjust)}
  ${phone("<b>7. Review.</b> Reads like the receipt. The title says the amount and the mode, so the cashier checks the two things that go wrong.", colReview)}
  ${phone("<b>8. Recorded.</b> Sending the receipt is the next thing the parent asks for, so it comes first. Share PDF goes straight to the share menu, on the school's usual paper, so WhatsApp is two taps.", colDone)}
  ${phone("<b>8b. Print receipt.</b> The print sheet the app already has: paper choice, with the school's usual one marked. Share PDF and Print share one footer, and plain text stays as a fallback.", colDone, receiptSheet)}
  ${phone("<b>9. Paying ahead.</b> Nothing due now: the shortcuts become months ahead, and the app creates the dues first.", colAhead)}
  </div>` +
  group("New idea: the whole year, for every selected student (Fees tab)") + `<div class="frames">
  ${phone("<b>A. Where it lives.</b> The Fees tab as it is today, with the summary folded. The new print button at the top stays reachable even when the summary is folded. One new control beside the sort: list or year. Class, Sec, Owes and Paid choose which students appear.", listView, "", fab)}
  ${phone("<b>B. Year view, names on the right.</b> Your idea: one row per student, one box per fee month. Red is due, green is cleared. Tap anywhere on a row to open that student's page.", yearView("right"), "", fab)}
  ${phone("<b>C. Same, names on the left.</b> Drawn so you can compare the two sides. The boxes and figures are identical.", yearView("left"), "", fab)}
  ${phone("<b>D. Scrolled.</b> A whole class on one screen. The month letters stay pinned, and this month's column stays shaded all the way down.", yearScrolled, "", fab)}
  ${phone("<b>F. Print lists and notices.</b> Opens with the class and section already filtered. The four kinds become tiles, and it says how many sheets will print.", yearView("right"), listsSheet, fab)}
  ${phone("<b>E. 11 fee months, real-life rows.</b> No fee in May, so May's column is gone and the boxes get wider. Empty boxes mean no fee was created: not billed, left the school, or joined late like Kiara.", yearEleven, "", fab)}
  </div>` +
  group("The page") + `<div class="frames">
  ${phone("<b>1. Opens on the answer.</b> The big number and the three parts that add up to it, and nothing else. Later and Paid moved out, because they are not part of what is owed.", pageTop, "", cta())}
  ${phone("<b>2. The whole session.</b> Twelve months at once, no sideways scrolling. April's small green line means part paid. Once you scroll past the big number, it moves into the Collect bar.", scrolled, "", dock("₹18,720"))}
  ${phone("<b>3. Payments, charges, concessions.</b> The amount leads. Only something unusual gets a pill, so a normal cleared payment stays quiet. Concessions and one-offs are no longer hidden under More. The cheque and concession rows are examples, not Aditi's data.", scrolledLower, "", dock("₹18,720"))}
  </div>` +
  group("One tap deeper") + `<div class="frames">
  ${phone("<b>4. Tap a month.</b> What was billed, paid and still open. Each open fee has its own Pay, and the button pays the whole month. Tapping the rest of a row still opens waive or cancel, two careful steps away.", pageTop, monthSheet)}
  ${phone("<b>5. Every due.</b> Grouped under months, so names lose &ldquo;— April 2026&rdquo;. Pay on a row pays that fee; Pay on a month heading pays the month. Overdue is said once, in the heading. Opens on what is still open, so ₹0 rows are gone unless you ask for Paid.", every)}
  ${phone("<b>6. More.</b> Only the rare things live here now. The no dues certificate stays visible but greyed, with the reason, until nothing is owed. Pause billing sits last, in caution colour.", pageTop, moreSheet)}
  ${phone("<b>6b. Statement.</b> The Statement button opens the app's print sheet: what will print, then Share PDF or Print.", pageTop, statementSheet)}
  </div>` +
  group("Other students") + `<div class="frames">
  ${phone("<b>7. All paid up.</b> A calm ₹0 and the next date to expect. Collect steps back, and paying early is still possible.", clear, "", `<div class="float"><div class="cta soft">${I("cash",20)}Collect in advance</div></div>`)}
  ${phone("<b>8. Billing paused.</b> Says so first, with the way back. Months with no dues show a dash, and only the one part owed appears.", paused, "", cta())}
  ${phone("<b>9. Not billed, but owes from last year.</b> Money first, then the one setup step. The months are hidden because there are none. The actions change to fit.", notBilled, "", cta())}
  </div>`;
</script>
</body>
</html>
