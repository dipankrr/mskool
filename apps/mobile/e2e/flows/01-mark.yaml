appId: com.mskool.app
name: 01 — class teacher marks and saves
---
# Dev-client first-run sheet (only after `pm clear`).
- runFlow:
    when:
      visible: "This is the developer menu"
    commands:
      - tapOn: "Continue"

- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 90000

- tapOn:
    id: "login-email"
- inputText: "teacher@demo-trust.test"
- tapOn:
    id: "login-password"
- inputText: "Password123!"
- hideKeyboard
- tapOn:
    id: "login-submit"

- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 45000

- tapOn:
    id: "tab-attendance"

- extendedWaitUntil:
    visible:
      id: "attendance-save"
    timeout: 45000

# Clock was pinned by the runner; the default day is Fri 6 Mar 2026.
- assertVisible: "Fri 6 Mar"

# The blank register shows no default statuses. The save CTA is the progress
# indicator: ghost at 0, filled at 1 of 1. Its visible count is gone; the
# counts below come from the button's accessibility label.
- assertVisible: "Not marked"
- assertVisible: "Save attendance"
- assertVisible: "Save attendance. 0 of 1 marked"
- tapOn:
    id: "bulk-present"
- assertVisible: "Save attendance. 1 of 1 marked"
# One tap on a present row toggles it to absent so the day has a real mix.
- tapOn: "Aditi Sharma"

- tapOn:
    id: "attendance-save"

- extendedWaitUntil:
    visible:
      id: "attendance-saved"
    timeout: 30000
- assertVisible: "Attendance done"
- assertVisible: "1 student marked for this day."

- tapOn:
    id: "attendance-view-summary"

- extendedWaitUntil:
    visible: "1 absent"
    timeout: 30000
# Tinted status cards keep their full count in the accessibility label.
- assertVisible: "1 absent"
# Half day is a visible bucket even before the first half-day mark exists.
- assertVisible: "Half day"
- scrollUntilVisible:
    element:
      text: "Most absent"
    direction: DOWN
- assertVisible: "Most absent"
