<html lang="en">

<style>
  :root{--ink:#101828;--muted:#5D6674;--blue:#2F6BFF;--red:#C8302A;--att:#0B6B3A;--fee:#1D63C7;--ex:#C4520A;--hw:#6941C6;--stu:#0E7490}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{position:relative;font-family:"Clash Grotesk",sans-serif;color:var(--ink);background:
    radial-gradient(48% 60% at 92% 8%,#F4E3F1 0%,rgba(244,227,241,0) 70%),
    radial-gradient(45% 55% at 0% 100%,#E3ECFD 0%,rgba(227,236,253,0) 70%),#F2F3F7}
  body::before{content:"";position:absolute;inset:0;background:url(../public/brand/doodles.svg) 0 0/520px repeat;opacity:.05}

  .left{position:absolute;left:72px;top:62px;width:660px}
  .brand{display:flex;align-items:center;gap:14px;font-weight:600;font-size:40px;letter-spacing:-.03em}
  .brand img{width:58px;height:58px;border-radius:16px}
  .brand b{color:var(--blue);font-weight:600}
  h1{margin-top:44px;font-weight:600;font-size:104px;line-height:.92;letter-spacing:-.045em}
  h1 .w{position:relative;color:var(--blue);white-space:nowrap}
  h1 .w svg{position:absolute;left:-4px;right:-4px;bottom:-16px;width:calc(100% + 8px);height:24px}
  .sub{margin-top:36px;font-size:29px;line-height:1.3;color:var(--muted);font-weight:500;letter-spacing:-.01em;max-width:540px}
  .sub b{color:var(--ink);font-weight:600}
  .langs{display:inline-flex;gap:10px}
  .langs span:nth-child(2){font-family:"Anek Devanagari"}.langs span:nth-child(3){font-family:"Clash Grotesk"}.langs .bn{font-family:"Anek Bangla"}
  .foot{position:absolute;left:72px;bottom:52px;display:flex;align-items:center;gap:10px}
  .chip{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 15px 0 11px;border-radius:99px;background:#fff;font-weight:600;font-size:19px;box-shadow:0 8px 20px -14px rgba(16,24,40,.45)}
  .chip i{font-size:21px}
  .url{position:absolute;right:64px;bottom:58px;font-family:"IBM Plex Mono";font-weight:600;font-size:24px;color:var(--ink);letter-spacing:.01em}

  /* right: a printed fee receipt, stamped, with Bookie in front */
  .rc{position:absolute;right:120px;top:58px;width:300px;padding:20px 22px 36px;background:#fff;rotate:5deg;font-family:"IBM Plex Mono";font-size:15px;line-height:1.75;color:#222;
    box-shadow:0 40px 60px -30px rgba(16,24,40,.45),0 10px 20px -12px rgba(16,24,40,.25);
    -webkit-mask:radial-gradient(circle at 8px 100%,transparent 7px,#000 7.5px) 0 0/16px 100% repeat-x}
  .rc .c{text-align:center}
  .rc .bn{font-family:"Clash Grotesk";font-weight:600;font-size:24px;letter-spacing:-.03em;line-height:1.3}
  .rc .bn b{color:var(--blue);font-weight:600}
  .rc .m{color:#777;font-size:13px}
  .rc hr{border:0;border-top:1.5px dashed #aaa;margin:8px 0}
  .rc .r{display:flex;justify-content:space-between}
  .rc .t{font-weight:600;font-size:19px}
  .rc .t b{background:#FFF3B0;padding:0 4px}
  .rc .bars{height:38px;margin:14px 10px 0;background:repeating-linear-gradient(90deg,#222 0 2px,transparent 2px 4px,#222 4px 5px,transparent 5px 8px,#222 8px 11px,transparent 11px 12px)}
  .stamp{position:absolute;right:150px;top:296px;rotate:-12deg;background:rgba(255,255,255,.8);font-family:"IBM Plex Mono";font-weight:600;font-size:30px;letter-spacing:.12em;color:var(--att);border:4px solid currentColor;border-radius:8px;padding:6px 14px;line-height:1;filter:url(#ink);box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px currentColor;opacity:.92}
  .att{position:absolute;right:236px;top:372px;width:290px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:22px;background:#E8F5EE;color:var(--att);rotate:-4deg;box-shadow:0 24px 40px -24px rgba(16,24,40,.5)}
  .att i{width:44px;height:44px;border-radius:50%;background:var(--att);color:#fff;display:grid;place-items:center;font-size:24px;flex:none}
  .att b{display:block;font-weight:600;font-size:19px;letter-spacing:-.02em;color:var(--ink)}
  .att span{font-size:15px;font-weight:500}
  .bookie{position:absolute;right:46px;top:330px;width:170px;rotate:10deg;filter:drop-shadow(0 18px 20px rgba(16,24,40,.25))}
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute"><filter id="ink"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/></filter></svg>

  <div class="left">
    <div class="brand"><img src="../public/brand/app-icon.svg" alt=""><span>m<b>S</b>kool</span></div>
    <h1>Retire the<br><span class="w">register.<svg viewBox="0 0 300 24" preserveAspectRatio="none"><path d="M4 16 C 70 4, 150 22, 296 8" fill="none" stroke="#C8302A" stroke-width="6" stroke-linecap="round"/></svg></span></h1>
    <p class="sub">School management on <b>one phone</b>. For Indian schools, in <span class="langs"><span>English,</span><span>हिंदी</span><span>and <span class="bn">বাংলা</span>.</span></span></p>
  </div>

  <div class="rc">
    <div class="c bn">m<b>S</b>kool</div>
    <div class="c m">FEE RECEIPT · NO. 2481</div>
    <hr>
    <div class="r"><span>Arnav Roy</span><span>II B</span></div>
    <div class="r"><span>November</span><span>₹1,850</span></div>
    <div class="r"><span>Paid by</span><span>UPI</span></div>
    <hr>
    <div class="r t"><span>Total</span><b>₹1,850</b></div>
    <div class="bars"></div>
  </div>
  <div class="stamp">PAID</div>
  <div class="att"><i class="ph-fill ph-check-circle"></i><div><b>412 of 420 present</b><span>Class registers done 9:05</span></div></div>
  <img class="bookie" src="../public/brand/mascot.svg" alt="">

  <div class="foot">
    <span class="chip"><i class="ph-fill ph-currency-inr" style="color:var(--fee)"></i>Fees</span>
    <span class="chip"><i class="ph-fill ph-check-circle" style="color:var(--att)"></i>Attendance</span>
    <span class="chip"><i class="ph-fill ph-medal" style="color:var(--ex)"></i>Exams</span>
    <span class="chip"><i class="ph-fill ph-paint-brush" style="color:var(--hw)"></i>Homework</span>
    <span class="chip"><i class="ph-fill ph-house-line" style="color:var(--stu)"></i>Parent app</span>
  </div>
  <div class="url">mskool.in</div>
</body>
</html>
